<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Japão 2026">
  <title>Japão 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="topbar-back" id="btn-back" aria-label="Voltar" hidden>‹</button>
      <h1 class="topbar-title" id="topbar-title">Japão 2026</h1>
      <button class="topbar-action" id="btn-theme" aria-label="Alternar tema">◐</button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="bottomnav" aria-label="Navegação principal">
      <a href="#/home" data-nav="home"><span class="nav-ico">⌂</span><span>Hoje</span></a>
      <a href="#/roteiro" data-nav="roteiro"><span class="nav-ico">☰</span><span>Roteiro</span></a>
      <a href="#/lugares" data-nav="lugares"><span class="nav-ico">◎</span><span>Lugares</span></a>
      <a href="#/fuji" data-nav="fuji"><span class="nav-ico">△</span><span>Fuji</span></a>
      <button id="btn-more" data-nav="mais" aria-haspopup="true"><span class="nav-ico">⋯</span><span>Mais</span></button>
    </nav>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>

    <div class="sheet" id="more-sheet" role="dialog" aria-label="Mais seções" hidden>
      <div class="sheet-handle"></div>
      <div class="sheet-grid">
        <a href="#/compras" class="sheet-item"><span>🛍</span>Compras</a>
        <a href="#/voos" class="sheet-item"><span>✈︎</span>Voos</a>
        <a href="#/reservas" class="sheet-item"><span>🎫</span>Reservas</a>
        <a href="#/documentos" class="sheet-item"><span>📄</span>Documentos</a>
        <a href="#/antes" class="sheet-item"><span>✓</span>Antes de ir</a>
        <a href="#/cidade/toquio" class="sheet-item"><span>🗼</span>Tóquio</a>
        <a href="#/cidade/kyoto" class="sheet-item"><span>⛩</span>Kyoto</a>
        <a href="#/cidade/osaka" class="sheet-item"><span>🏯</span>Osaka</a>
        <a href="#/info" class="sheet-item"><span>ⓘ</span>Info úteis</a>
        <a href="#/links" class="sheet-item"><span>🔗</span>Links</a>
        <a href="#/dados" class="sheet-item"><span>⇅</span>Dados</a>
      </div>
    </div>

    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" id="modal">
        <div class="modal-head">
          <h2 id="modal-title">Editar</h2>
          <button class="modal-close" id="modal-close" aria-label="Fechar">✕</button>
        </div>
        <form id="modal-form" class="modal-body"></form>
      </div>
    </div>

    <div id="toast-zone" class="toast-zone" aria-live="polite"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
